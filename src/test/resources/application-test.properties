spring.profiles.active=test

# Dùng database H2 in-memory \u0111\u1EC3 test thay vì PostgreSQL th\u1EADt
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT (cho \u0111\u1EE7 bi\u1EBFn, không c\u1EA7n giá tr\u1ECB th\u1EADt)
app.jwt.secret=test-secret
app.jwt.access-token-expiration-ms=3600000
app.jwt.refresh-token-expiration-ms=86400000

# Disable mail (\u0111\u1EC3 tránh bean mail fail)
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=dummy
spring.mail.password=dummy

# Mock Google OAuth \u0111\u1EC3 tránh l\u1ED7i placeholder
spring.security.oauth2.client.registration.google.client-id=dummy-client-id
spring.security.oauth2.client.registration.google.client-secret=dummy-client-secret
